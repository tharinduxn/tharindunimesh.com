<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Tharindu Nimesh — Thoughtful products. Built right.</title>
  <desc id="description">An editorial charcoal cover with ivory lettering, terracotta accents, and copper orbital trails inspired by the portfolio introduction.</desc>
  <defs>
    <radialGradient id="backdrop" cx="0" cy="0" r="1" gradientTransform="translate(1010 218) rotate(90) scale(310 400)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35271f"/>
      <stop offset="1" stop-color="#171815"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0.48" stop-color="#c38a5f" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#c38a5f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c38a5f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="790" y1="100" x2="1190" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ba95" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#e6ba95" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e6ba95"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="430" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="430" fill="url(#backdrop)"/>
    <circle cx="1010" cy="215" r="216" fill="url(#halo)"/>
    <circle cx="1010" cy="215" r="120" fill="#191a16" stroke="#d4a57d" stroke-opacity="0.12"/>
    <ellipse cx="1010" cy="215" rx="201" ry="73" transform="rotate(-27 1010 215)" stroke="url(#orbit)" stroke-width="1.2"/>
    <ellipse cx="1010" cy="215" rx="201" ry="73" transform="rotate(27 1010 215)" stroke="url(#orbit)" stroke-width="1.2"/>
    <ellipse cx="1010" cy="215" rx="181" ry="69" transform="rotate(-67 1010 215)" stroke="url(#orbit)" stroke-width="1.2"/>
    <circle cx="1185" cy="158" r="3" fill="#e6ba95"/>
    <circle cx="929" cy="60" r="2.5" fill="#e6ba95"/>
    <g stroke="#e6ba95" stroke-width="2" stroke-linecap="round">
      <path d="M1010 188V242M983 215H1037M991 196L1029 234M991 234L1029 196"/>
    </g>
    <text x="64" y="77" fill="#f6f4ee" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="-2">tharindu<tspan fill="#e59b86">.</tspan></text>
    <text x="64" y="153" fill="#baada0" font-family="'Courier New', monospace" font-size="11" letter-spacing="2.3">PERSONAL PORTFOLIO / DESIGN + ENGINEERING</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-3.2">
      <text x="60" y="232" fill="#f6f4ee">Thoughtful products.</text>
      <text x="60" y="302" fill="#b8bab0">Built right<tspan fill="#e59b86">.</tspan></text>
    </g>
    <text x="64" y="380" fill="#baada0" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.4">THARINDU NIMESH</text>
    <text x="1216" y="380" text-anchor="end" fill="#baada0" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.6">MATARA, SRI LANKA</text>
  </g>
</svg>
